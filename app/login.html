<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sisteco — Ingresar</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ---- Reset ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ---- Design tokens (Sisteco brand) ---- */
    :root {
      --bg: #F8F7F5;
      --text: #111111;
      --text-secondary: #666666;
      --accent: #c5ed36;
      --accent-hover: #b3d82f;
      --border: #e5e5e5;
      --radius: 12px;
      --shadow: 0 2px 16px rgba(0,0,0,0.08);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Source Sans 3', system-ui, sans-serif;
      color: var(--text);
    }

    /* ---- Layout: centrado vertical y horizontal ---- */
    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ---- Card ---- */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* ---- Logo / Branding ---- */
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .login-logo {
      width: 48px;
      height: 48px;
    }

    .login-wordmark {
      font-family: 'Nasalization', 'Source Sans 3', sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .login-tagline {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* ---- Nasalization font ---- */
    @font-face {
      font-family: 'Nasalization';
      src: url('../shared/assets/Nasalization-Rg.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* ---- Separator ---- */
    .login-separator {
      width: 100%;
      height: 1px;
      background: var(--border);
    }

    /* ---- Clerk SignIn container ---- */
    #clerk-signin {
      width: 100%;
    }

    /* ---- Override Clerk styles para match Sisteco brand ---- */
    /* Clerk usa shadow DOM en algunos componentes — estos estilos afectan el wrapper */
    .cl-rootBox,
    .cl-card {
      box-shadow: none !important;
      border: none !important;
      background: transparent !important;
    }

    /* ---- Footer ---- */
    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .login-footer a {
      color: var(--text);
      text-decoration: underline;
    }

    /* ---- Mobile ---- */
    @media (max-width: 480px) {
      .login-card {
        padding: 32px 20px;
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>

  <div class="login-page" role="main">

    <div class="login-card">

      <!-- Branding -->
      <div class="login-brand">
        <img
          class="login-logo"
          src="../shared/assets/icon-sisteco.png"
          alt="Sisteco"
          width="48"
          height="48"
        >
        <div class="login-wordmark">Sisteco</div>
        <p class="login-tagline">Menos leads, mas cierres</p>
      </div>

      <div class="login-separator"></div>

      <!-- Clerk Sign In Component (mounted by Clerk.load()) -->
      <div id="clerk-signin" aria-label="Formulario de inicio de sesion"></div>

    </div>

    <!-- Footer -->
    <p class="login-footer">
      Plataforma B2B SaaS para ventas en Chile &nbsp;&middot;&nbsp;
      <a href="mailto:contacto@sisteco.cl">contacto@sisteco.cl</a>
    </p>

  </div>

  <!-- ====================================================================
       Clerk JS SDK — cargado via CDN
       IMPORTANTE: Reemplazar pk_test_... con la clave real de Clerk Dashboard
       ==================================================================== -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_bmF0aW9uYWwtcmFiYml0LTQ4LmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://national-rabbit-48.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"
  ></script>

  <!-- Shared auth module -->
  <script src="../shared/auth.js"></script>

  <!-- Page logic: montar Clerk SignIn y manejar redirect post-login -->
  <script>
  (function () {
    'use strict';

    window.addEventListener('load', async function () {
      if (typeof Clerk === 'undefined') {
        console.error('[Login] Clerk SDK no encontrado. Verificar URL del CDN.');
        return;
      }

      try {
        await Clerk.load();
      } catch (err) {
        console.error('[Login] Error cargando Clerk:', err);
        return;
      }

      // Si el usuario ya tiene sesion activa, redirigir a su pagina de rol
      if (Clerk.user) {
        var orgId = Clerk.session?.lastActiveOrganizationId;
        if (orgId) {
          // Tiene sesion + org activa → redirigir segun rol
          await window.SistecoAuth.redirectToRolePage();
          return;
        }
      }

      // Montar componente de sign-in de Clerk
      var signInEl = document.getElementById('clerk-signin');
      if (signInEl) {
        Clerk.mountSignIn(signInEl, {
          /* Redirigir a index.html despues del login — index.html determina el rol */
          redirectUrl: '/app/index.html',
          /* Tambien aceptar Google OAuth */
          appearance: {
            elements: {
              card: {
                boxShadow: 'none',
                border: 'none',
              },
            },
          },
        });
      }

      // Escuchar cambios de sesion (post-login)
      Clerk.addListener(async function (state) {
        if (state.user && state.session?.lastActiveOrganizationId) {
          // Login exitoso con org activa
          await window.SistecoAuth.redirectToRolePage();
        }
      });
    });

  })();
  </script>

</body>
</html>
